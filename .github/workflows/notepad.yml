name: GoreeCloud Notepad native checks

on:
  push:
    paths:
      - 'apps/notepad/**'
      - '.github/workflows/notepad.yml'
  pull_request:
    paths:
      - 'apps/notepad/**'
      - '.github/workflows/notepad.yml'

jobs:
  native-gtk4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native GTK4 runtime
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb dpkg-dev fakeroot desktop-file-utils
      - name: Check storage and preferences
        working-directory: apps/notepad
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile native application
        working-directory: apps/notepad
        run: /usr/bin/python3 -m compileall -q goreecloud_notepad
      - name: Build Debian package
        working-directory: apps/notepad
        run: /usr/bin/python3 packaging/build_deb.py
      - name: Isolated Debian install, upgrade, and removal
        working-directory: apps/notepad
        run: /usr/bin/python3 tests/test_deb_lifecycle.py
      - name: GTK4 virtual-display smoke
        working-directory: apps/notepad
        run: |
          xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_format_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_source_style_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_inline_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_inline_performance_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_packaged_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_unicode_lines_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_long_line_smoke.py
          xvfb-run -a /usr/bin/python3 tests/gui_caret_status_smoke.py
