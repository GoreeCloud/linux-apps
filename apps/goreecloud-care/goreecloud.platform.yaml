conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - apps/goreecloud-care/GLAZE-UI-CONFORMANCE.md
    - apps/goreecloud-care/GLAZE-UI-V2.2-MIGRATION.md
    - apps/goreecloud-care/GLAZE-UI-V1.4-MIGRATION.md
    - apps/goreecloud-care/goreecloud_care/glaze_v22.py
    - apps/goreecloud-care/goreecloud_care/glaze_v22_global.py
    - apps/goreecloud-care/tests/test_glaze_v22_contract.py
  blockers:
    - Exact 0.2.0-dev2 automated qualification must pass for the new source/package identity.
    - Glaze UI 2.2 representative rendered/native and accessibility acceptance is required on Zorin OS 17.3 for the exact candidate.
    - Glaze UI authority must explicitly accept the exact 2.2 consumer candidate before current design-system conformance can be claimed.
    - Privacy Shield must independently accept the exact 0.2.0-dev2 candidate before production privacy status can be claimed.
    - Wardveil must independently govern the exact 0.2.0-dev2 privilege-boundary evidence before protection permission can transfer.
    - Everkeep must independently accept exact 0.2.0-dev2 restore/rollback evidence before continuity can become ready.
    - Platform Contract authority must explicitly determine conformant/promotable status for the exact dev2 identity.
    - Stable promotion requires a later exact release candidate and cannot be inferred from historical 0.1.0 or dev1 acceptance.
