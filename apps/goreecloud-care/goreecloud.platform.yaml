schema_version: "0.3"

component:
  type: application
  id: goreecloud-care
  product_name: GoreeCloud Care
  repository: GoreeCloud/linux-apps

# The immutable Stable 0.1.0 release remains governed by RELEASE-ACCEPTANCE.md.
# The qualified 0.2.0-dev1 / Glaze UI V1.4 candidate remains historical migration
# and regression evidence. This manifest describes the active Glaze UI 2.2
# development line and must not inherit acceptance from either earlier identity.
lifecycle: development
version: 0.2.0-dev2

supported_platforms:
  - linux

api:
  versions: ["1"]
  endpoints:
    - name: maintenance-report
      url: local-cli://goreecloud-care/report
      purpose: Privacy-safe schema-versioned local maintenance snapshot for authorized local consumers.
    - name: health
      url: local-cli://goreecloud-care/health
      purpose: Minimized local readiness and product-version status without telemetry or privileged execution.
    - name: privacy-status
      url: local-cli://goreecloud-care/privacy-status
      purpose: Privacy Shield-shaped local privacy status for the declared Care application adapter.
    - name: security-status
      url: local-cli://goreecloud-care/security-status
      purpose: Wardveil-compatible scoped status for the installed Care privilege boundary.
    - name: continuity-status
      url: local-cli://goreecloud-care/continuity-status
      purpose: Everkeep continuity status for Care package restore and rollback evidence.

platform_systems:
  manager:
    result: not-applicable-justified
    version: null
    evidence: [API.md, CAPABILITIES.md, goreecloud_care/platform_status.py]
    notes: The current local single-user Care scope has no central, remote, or delegated administration.
  privacy_shield:
    result: applicable-nonconformant
    version: null
    evidence:
      - PRIVACY.md
      - contracts/privacy-shield.application.json
      - contracts/privacy-shield.adapter.json
      - goreecloud_care/platform_status.py
      - RELEASE-ACCEPTANCE.md
      - https://github.com/GoreeCloud/goreecloud-privacy-shield/issues/104
    notes: Stable 0.1.0 has historical Privacy Shield acceptance, while the 0.2.0-dev1 V1.4 candidate remains historical migration evidence. The active 0.2.0-dev2 source/package identity requires fresh runtime/production acceptance. Care-local evidence intentionally fails closed and cannot self-promote that external governance decision.
  wardveil_security:
    result: applicable-nonconformant
    version: null
    evidence:
      - SECURITY.md
      - WARDVEIL-INTEGRATION.md
      - goreecloud_care/platform_status.py
      - packaging/goreecloud-care-helper
      - packaging/com.goreecloud.care.policy
      - tests/test_helper.py
      - tests/test_privilege.py
      - RELEASE-ACCEPTANCE.md
      - https://github.com/GoreeCloud/goreecloud-wardveil/issues/147
    notes: Stable 0.1.0 has historical scoped Wardveil acceptance. The active 0.2.0-dev2 package must independently prove and obtain governance for the local-maintenance-privilege-boundary before any Wardveil protection claim transfers.
  everkeep:
    result: applicable-nonconformant
    version: null
    evidence:
      - RECOVERY.md
      - RELEASE-ACCEPTANCE.md
      - contracts/everkeep.adoption.json
      - contracts/everkeep.acceptance.json
      - goreecloud_care/platform_status.py
      - scripts/validate-package-lifecycle.sh
      - scripts/run-representative-acceptance.sh
      - https://github.com/GoreeCloud/goreecloud-everkeep/issues/62
    notes: Historical Stable 0.1.0 recovery readiness and the dev1 V1.4 package lifecycle are exact-build scoped. 0.2.0-dev2 requires new package lifecycle, representative-target, exact package SHA, and separate Everkeep promotion evidence.
  glaze_ui:
    result: applicable-nonconformant
    version: "2.2.0"
    evidence:
      - GLAZE-UI-CONFORMANCE.md
      - GLAZE-UI-V2.2-MIGRATION.md
      - GLAZE-UI-V1.4-MIGRATION.md
      - BRANDING.md
      - goreecloud_care/glaze_v22.py
      - goreecloud_care/glaze_v22_global.py
      - goreecloud_care/glaze_v14.py
      - tests/test_glaze_v22_contract.py
      - tests/test_glaze_v14_contract.py
      - tests/test_ui_contract.py
      - tests/test_focus_resilience.py
      - tests/test_accessibility_identity.py
      - tests/runtime_ui_acceptance.py
      - https://github.com/GoreeCloud/goreecloud-glaze-ui/commit/6731098b28dd0393faa878c70d989a221d714a20
      - https://github.com/GoreeCloud/goreecloud-glaze-ui/issues/212
    notes: GoreeCloud Care 0.2.0-dev2 targets the current Stable Glaze UI 2.2.0 authority at exact revision 6731098b28dd0393faa878c70d989a221d714a20. V1.4 remains historical migration/regression evidence only and cannot satisfy current Stable-policy alignment. The 2.2 design-system release and automated source evidence do not grant downstream Care conformance; exact representative rendered/native, accessibility, product, and consumer acceptance remain required.
  mesh:
    result: not-applicable-justified
    version: null
    evidence: [API.md, CAPABILITIES.md, goreecloud_care/platform_status.py]
    notes: Current Care has no cross-application coordination, service discovery, Mesh event transport, or Mesh policy authority.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence: [SPECIFICATIONS.md, API.md]
    notes: Current Care has no GoreeCloud account, remote management, multi-user behavior, or delegated administration.
  sync:
    result: not-applicable-justified
    version: null
    evidence: [SPECIFICATIONS.md, API.md, PRIVACY.md]
    notes: Current Care owns no cross-device synchronized dataset or remote state. Maintenance scans, reports, and status are local-first and device-scoped.

health:
  health_endpoint: local-cli://goreecloud-care/health
  readiness_endpoint: local-cli://goreecloud-care/health

continuity:
  backup:
    required: false
    requirements:
      - Care persists no substantial durable user application data requiring an application-owned backup workflow; continuity is exact package/source recovery evidence.
  restore:
    required: true
    requirements:
      - The exact 0.2.0-dev2 / 0.2.0~dev2 candidate must pass install, remove/reinstall, downgrade, restore, final installed validation, provenance, and representative-target handoff before release promotion.
      - Historical Stable 0.1.0 recovery evidence and dev1 qualification remain audit/rollback context and do not accept the new candidate.
      - Permanent Trash deletion is irreversible maintenance behavior and is not represented as recoverable application data.
  export:
    required: false
    requirements:
      - Care has no durable user application dataset requiring application-data export/import; read-only reports/status are available.
  portability:
    required: true
    requirements:
      - Report and local API schemas/versioning remain explicit and machine-readable.
      - Package policy, recovery, migration, rollback, and exact provenance remain documented without proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime, reports, local platform status, and Maintenance Insights.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface and Maintenance Insights.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Assistive-technology roles, names, descriptions, and status semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "2.2.0"
  requires: [goreecloud-platform-contract==0.3, glaze-ui==2.2.0]
  provides:
    - goreecloud-care-local-maintenance
    - goreecloud-care-read-only-maintenance-report
    - goreecloud-care-read-only-maintenance-insights
    - goreecloud-care-local-status-api-v1

