health:
  health_endpoint: local-cli://goreecloud-care/health
  readiness_endpoint: local-cli://goreecloud-care/health

continuity:
  backup:
    required: false
    requirements:
      - Care persists no substantial durable user application data requiring an application-owned backup workflow; continuity is exact package/source recovery evidence.
  restore:
    required: true
    requirements:
      - Exact 0.1.0 install, remove/reinstall, accepted dev17 downgrade, restore, final installed validation, provenance, and representative-target handoff passed on Zorin OS 17.3.
      - Permanent Trash deletion is irreversible maintenance behavior and is not represented as recoverable application data.
  export:
    required: false
    requirements:
      - Care has no durable user application dataset requiring application-data export/import; read-only reports/status are available.
  portability:
    required: true
    requirements:
      - Report and local API schemas/versioning remain explicit and machine-readable.
      - Package policy, recovery, migration, rollback, and exact provenance remain documented without proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime, reports, local platform status, and Maintenance Insights.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface and Maintenance Insights.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Assistive-technology roles, names, descriptions, and status semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.2.0"
  requires: [goreecloud-platform-contract==0.2, glaze-ui==1.2.0]
